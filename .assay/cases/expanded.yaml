- id: drawing.erase_undo
  title: Erase a shape and restore the original with undo
  dimension: functional
  severity: major
  tags: []
  viewport: desktop
  setup: *id002
  expect_before:
    elements:
      len: 0
    files:
      len: 0
  steps:
  - *id005
  - *id006
  - *id007
  - eval: sessionStorage.setItem('__erasedShape',JSON.stringify(JSON.parse(localStorage.getItem('excalidraw')||'[]').filter(e=>!e.isDeleted).map(({id,type,x,y,width,height,angle})=>({id,type,x,y,width,height,angle}))))
  - click:
      role: button
      name: Eraser
      exact: true
  - draw:
      within: *id001
      points:
      - - 0.32
        - 0.47
      - - 0.66
        - 0.47
  - wait: 700
  - expect:
      invariant: JSON.parse(localStorage.getItem('excalidraw')||'[]').filter(e=>!e.isDeleted).length === 0
  - click:
      role: button
      name: Undo
      exact: true
  - wait: 700
  must:
  - *id003
  - *id004
  - state:
      elements:
        len: 1
        contains:
          type: rectangle
  - allowed_changes:
    - elements
    - preferences
  - state:
      theme:
        exists: true
      preferences:
        exists: true
      files:
        exists: true
      library:
        any_of:
        - null
        - exists: true
  - invariant: JSON.stringify(JSON.parse(localStorage.getItem('excalidraw')||'[]').filter(e=>!e.isDeleted).map(({id,type,x,y,width,height,angle})=>({id,type,x,y,width,height,angle})))===sessionStorage.getItem('__erasedShape')
- id: drawing.group_ungroup
  title: Group and ungroup two shapes without losing their geometry
  dimension: functional
  severity: major
  tags: []
  viewport: desktop
  setup: *id002
  expect_before:
    elements:
      len: 0
    files:
      len: 0
  steps:
  - *id005
  - *id006
  - *id007
  - click:
      role: button
      name: Ellipse
      exact: true
  - draw:
      within: *id001
      points:
      - - 0.65
        - 0.4
      - - 0.8
        - 0.55
  - wait: 500
  - eval: sessionStorage.setItem('__groupedShapes',JSON.stringify(JSON.parse(localStorage.getItem('excalidraw')||'[]').filter(e=>!e.isDeleted).map(({id,type,x,y,width,height,angle})=>({id,type,x,y,width,height,angle}))))
  - press: ControlOrMeta+a
  - press: ControlOrMeta+g
  - wait: 700
  - expect:
      invariant: JSON.parse(localStorage.getItem('excalidraw')||'[]').filter(e=>!e.isDeleted).length === 2 && JSON.parse(localStorage.getItem('excalidraw')||'[]').filter(e=>!e.isDeleted).every(e=>e.groupIds.length===1)
  - press: ControlOrMeta+Shift+g
  - wait: 700
  must:
  - *id003
  - *id004
  - state:
      elements:
        len: 2
  - invariant: JSON.parse(localStorage.getItem('excalidraw')||'[]').filter(e=>!e.isDeleted).every(e=>e.groupIds.length===0)
  - allowed_changes:
    - elements
    - preferences
  - state:
      theme:
        exists: true
      preferences:
        exists: true
      files:
        exists: true
      library:
        any_of:
        - null
        - exists: true
  - invariant: JSON.stringify(JSON.parse(localStorage.getItem('excalidraw')||'[]').filter(e=>!e.isDeleted).map(({id,type,x,y,width,height,angle})=>({id,type,x,y,width,height,angle})))===sessionStorage.getItem('__groupedShapes')
