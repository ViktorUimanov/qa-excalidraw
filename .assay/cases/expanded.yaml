cases:
- id: compat.reload_console
  title: Chromium reload has no console compatibility errors
  dimension: reliability
  severity: major
  tags:
  - compatibility
  - known-bug
  viewport: desktop
  setup: &id002
  - goto: /
  - wait_for: &id001
      css: canvas.excalidraw__canvas.interactive
  - wait: 700
  expect_before:
    elements:
      len: 0
    files:
      len: 0
  steps:
  - reload: true
  - wait_for: *id001
  - wait: 500
  must:
  - &id003
    no_errors:
      allow:
      - '^Permissions policy violation: unload is not allowed in this document\.$'
  - &id004
    no_failed_requests: true
  - no_errors: true
  - allowed_changes:
    - elements
    - preferences
  - state:
      theme:
        exists: true
      preferences:
        exists: true
      files:
        exists: true
      library:
        any_of:
        - null
        - exists: true
