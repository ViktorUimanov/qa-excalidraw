- id: images.persist_render
  title: Import an image, reload it and verify both stored bytes and visible pixels
  dimension: functional
  severity: major
  tags: []
  viewport: files
  setup: *id002
  expect_before:
    elements:
      len: 0
    files:
      len: 0
  steps:
  - click:
      role: button
      name: More tools
      exact: true
  - click:
      role: menuitem
      name: Insert image
      exact: false
  - upload:
      css: input[type=file]
      file: fixtures/green-marker.png
  - wait: 1000
  - click:
      target: *id001
      position:
      - 600
      - 400
  - wait: 1000
  - reload: true
  - wait_for: *id001
  - wait: 1000
  must:
  - *id003
  - *id004
  - state:
      elements:
        len: 1
        contains:
          type: image
      files:
        len: 1
  - invariant: () => {const c=document.querySelector('canvas.static');const p=c.getContext('2d').getImageData(0,0,c.width,c.height).data;let
      n=0;for(let i=0;i<p.length;i+=4)if(p[i]<70&&p[i+1]>140&&p[i+1]<220&&p[i+2]<110&&p[i+3]>200)n++;return n>1000;}
  - allowed_changes:
    - elements
    - preferences
    - files
  - state:
      theme:
        exists: true
      preferences:
        exists: true
      files:
        exists: true
      library:
        any_of:
        - null
        - exists: true
