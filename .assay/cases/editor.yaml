      elements:
        len: 1
        contains:
          id: assay-import-rectangle
          type: rectangle
          width: 250
          height: 150
  - allowed_changes:
    - elements
    - preferences
  - state:
      theme:
        exists: true
      preferences:
        exists: true
      files:
        exists: true
      library:
        any_of:
        - null
        - exists: true
