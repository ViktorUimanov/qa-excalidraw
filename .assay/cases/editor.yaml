cases:
- id: drawing.rectangle_persists
  title: Draw a rectangle and retain its geometry after reload
  severity: critical
  tags:
  - smoke
  - drawing
  - persistence
  viewport: desktop
  setup: &id002
  - goto: /
  - wait_for: &id001
      css: canvas.excalidraw__canvas.interactive
  - wait: 700
  expect_before:
    elements:
      len: 0
  steps:
  - &id005
    click:
      role: button
      name: Rectangle
      exact: true
  - &id006
    draw:
      within: *id001
      points:
      - - 0.38
        - 0.38
      - - 0.6
        - 0.58
  - &id007
    wait: 800
  - expect:
      invariant: JSON.parse(localStorage.getItem('excalidraw') || '[]').filter(e=>!e.isDeleted).length === 1 && JSON.parse(localStorage.getItem('excalidraw')
        || '[]').filter(e=>!e.isDeleted)[0].width > 100
  - eval: sessionStorage.setItem('__assayExpectedScene', JSON.stringify(JSON.parse(localStorage.getItem('excalidraw') || '[]').filter(e=>!e.isDeleted).map(({id,type,x,y,width,height,angle,text,points})=>({id,type,x,y,width,height,angle,text,points}))));
  - reload: true
  - wait_for: *id001
  - wait: 800
  must:
  - &id003
    no_errors:
      allow:
      - '^Permissions policy violation: unload is not allowed in this document\.$'
  - &id004
    no_failed_requests: true
  - state:
      elements:
        len: 1
        contains:
          type: rectangle
          width:
            gt: 100
          height:
            gt: 100
  - invariant: JSON.stringify(JSON.parse(localStorage.getItem('excalidraw') || '[]').filter(e=>!e.isDeleted).map(({id,type,x,y,width,height,angle,text,points})=>({id,type,x,y,width,height,angle,text,points})))
      === sessionStorage.getItem('__assayExpectedScene')
  - allowed_changes:
    - elements
    - preferences
  - state:
      theme:
        exists: true
      preferences:
        exists: true
      files:
        exists: true
      library:
        any_of:
        - null
        - exists: true
- id: drawing.freehand_undo_redo
  title: Draw a freehand stroke, undo it and restore it
  severity: critical
  tags:
  - drawing
  - history
  viewport: desktop
  setup: *id002
  expect_before:
    elements:
      len: 0
  steps:
  - click:
      role: button
      name: Draw
      exact: true
  - draw:
      within: *id001
      points:
      - - 0.38
        - 0.4
      - - 0.42
        - 0.35
      - - 0.48
        - 0.45
      - - 0.54
        - 0.36
      - - 0.6
        - 0.44
  - wait: 800
  - expect:
      invariant: JSON.parse(localStorage.getItem('excalidraw') || '[]').filter(e=>!e.isDeleted).length === 1 && JSON.parse(localStorage.getItem('excalidraw')
        || '[]').filter(e=>!e.isDeleted)[0].points.length > 3
  - eval: sessionStorage.setItem('__assayExpectedStroke', JSON.stringify(JSON.parse(localStorage.getItem('excalidraw') ||
      '[]').filter(e=>!e.isDeleted).map(({id,type,x,y,width,height,angle,text,points})=>({id,type,x,y,width,height,angle,text,points}))));
  - click:
      role: button
      name: Undo
      exact: true
  - wait: 800
  - expect:
      invariant: JSON.parse(localStorage.getItem('excalidraw') || '[]').filter(e=>!e.isDeleted).length === 0
  - click:
      role: button
      name: Redo
      exact: true
  - wait: 800
  must:
  - *id003
  - *id004
  - state:
      elements:
        len: 1
        contains:
          type: freedraw
          points:
            len:
              gt: 3
  - invariant: JSON.stringify(JSON.parse(localStorage.getItem('excalidraw') || '[]').filter(e=>!e.isDeleted).map(({id,type,x,y,width,height,angle,text,points})=>({id,type,x,y,width,height,angle,text,points})))
      === sessionStorage.getItem('__assayExpectedStroke')
  - allowed_changes:
    - elements
    - preferences
  - state:
      theme:
        exists: true
      preferences:
        exists: true
      files:
        exists: true
      library:
        any_of:
        - null
        - exists: true
- id: drawing.text_persists
