  setup: *id002
  expect_before:
    elements:
      len: 0
  steps:
  - click:
      role: button
      name: Text
      exact: true
  - click:
      target: *id001
      position:
      - 500
      - 350
  - type: Assay checks real saved drawings.
  - press: Escape
  - wait: 800
  - reload: true
  - wait_for: *id001
  - wait: 800
  must:
  - *id003
  - *id004
