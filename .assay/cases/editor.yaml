- id: import.scene
  title: Import a scene file and retain its object after reload
  severity: critical
  tags:
  - import
  - persistence
  viewport: files
  setup: *id002
  expect_before:
    elements:
      len: 0
  steps:
  - click:
      testid: main-menu-trigger
  - click:
      role: menuitem
      name: Open
      exact: true
  - upload:
      css: input[type=file]
      file: fixtures/import-scene.excalidraw
  - wait: 1000
  - reload: true
  - wait_for: *id001
  - wait: 800
  must:
  - *id003
  - *id004
