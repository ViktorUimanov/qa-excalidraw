      elements:
        len: 1
        contains:
          type: text
          text: Assay checks real saved drawings.
  - allowed_changes:
    - elements
    - preferences
  - state:
      theme:
        exists: true
      preferences:
        exists: true
      files:
        exists: true
      library:
        any_of:
        - null
        - exists: true
- id: drawing.duplicate_delete
  title: Duplicate a selected shape, delete the copy and preserve the original
  severity: critical
  tags:
  - editing
  - deletion
  viewport: desktop
  setup: *id002
  expect_before:
    elements:
      len: 0
  steps:
  - *id005
  - *id006
  - *id007
  - eval: window.__assayOriginalId = (JSON.parse(localStorage.getItem('excalidraw') || '[]').filter(e=>!e.isDeleted).map(({id,type,x,y,width,height,angle,text,points})=>({id,type,x,y,width,height,angle,text,points})))[0].id;
      window.__assayOriginalScene = JSON.stringify(JSON.parse(localStorage.getItem('excalidraw') || '[]').filter(e=>!e.isDeleted).map(({id,type,x,y,width,height,angle,text,points})=>({id,type,x,y,width,height,angle,text,points})));
  - click:
      role: button
      name: Duplicate
      exact: true
  - wait: 800
  - expect:
      invariant: JSON.parse(localStorage.getItem('excalidraw') || '[]').filter(e=>!e.isDeleted).length === 2
  - click:
      role: button
      name: Delete
      exact: true
  - wait: 800
  must:
  - *id003
  - *id004
  - state:
      elements:
        len: 1
        contains:
          type: rectangle
  - invariant: JSON.parse(localStorage.getItem('excalidraw') || '[]').filter(e=>!e.isDeleted)[0].id === window.__assayOriginalId
  - invariant: JSON.stringify(JSON.parse(localStorage.getItem('excalidraw') || '[]').filter(e=>!e.isDeleted).map(({id,type,x,y,width,height,angle,text,points})=>({id,type,x,y,width,height,angle,text,points})))
      === window.__assayOriginalScene
  - allowed_changes:
    - elements
    - preferences
  - state:
      theme:
        exists: true
      preferences:
        exists: true
      files:
        exists: true
      library:
        any_of:
        - null
        - exists: true
- id: export.svg
  title: Export a drawn rectangle as a nonempty SVG file
  severity: critical
  tags:
  - export
  - svg
  viewport: files
  setup: *id002
  expect_before:
    elements:
      len: 0
  steps:
  - *id005
  - *id006
  - *id007
  - click:
      testid: main-menu-trigger
  - click:
      role: menuitem
      name: Export image...
      exact: true
  - download:
      role: button
      name: Export to SVG
      exact: true
      save_as: export.svg
  must:
  - *id003
  - *id004
  - state:
      elements:
        len: 1
        contains:
          type: rectangle
  - invariant: '{vars.download_size} > 100'
  - invariant: '''{vars.download_name}''.endsWith(''.svg'')'
  - allowed_changes:
    - elements
    - preferences
  - state:
      theme:
        exists: true
      preferences:
        exists: true
      files:
        exists: true
      library:
        any_of:
        - null
        - exists: true
